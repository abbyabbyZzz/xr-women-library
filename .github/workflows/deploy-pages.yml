name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Build website
        run: npm run build:pages
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_ZOTERO_API_URL: ${{ vars.ZOTERO_API_URL }}
      - name: Upload website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - name: Wait for uploaded website
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import { setTimeout } from 'node:timers/promises';
          const url = `https://api.github.com/repos/${process.env.GH_REPOSITORY}/actions/runs/${process.env.GH_RUN_ID}/artifacts?per_page=100`;
          for (let attempt = 1; attempt <= 12; attempt++) {
            const response = await fetch(url, {
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
              signal: AbortSignal.timeout(10000),
            });
            if (!response.ok) throw new Error(`Cannot read uploaded artifact metadata: HTTP ${response.status}`);
            const result = await response.json();
            if (result.artifacts.some(artifact => artifact.name === 'github-pages' && !artifact.expired)) {
              console.log('Uploaded website is ready for deployment.');
              process.exit(0);
            }
            console.log(`Waiting for uploaded website (${attempt}/12).`);
            await setTimeout(5000);
          }
          throw new Error('Uploaded website was not visible within the deployment wait period.');
          NODE
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
